name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to publish (e.g. 0.1.0)"
        required: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve installer URL and SHA256
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          $url = "https://github.com/shehjaddev/pathctl/releases/download/v$ver/pathctl.exe"
          $tmp = Join-Path $env:RUNNER_TEMP "pathctl.exe"
          Invoke-WebRequest -Uri $url -OutFile $tmp
          $hash = (Get-FileHash $tmp -Algorithm SHA256).Hash
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$ver"
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLER_URL=$url"
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLER_SHA256=$hash"
      - name: Submit winget manifest
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            Write-Host "No WINGET_PAT secret -- winget submission skipped."
            Write-Host "First submission is interactive and must be run once on a dev machine:"
            Write-Host "  wingetcreate new $env:INSTALLER_URL --token <WINGET_PAT>"
            Write-Host "Later versions publish automatically from this workflow:"
            Write-Host "  wingetcreate update shehjaddev.pathctl --version $env:VERSION --urls $env:INSTALLER_URL --submit --token <WINGET_PAT>"
            exit 0
          }
          # `update` only works once the package exists in microsoft/winget-pkgs;
          # wingetcreate computes hashes itself (no --hash flag). The first
          # submission is a one-time interactive `wingetcreate new` (above).
          wingetcreate update shehjaddev.pathctl --version $env:VERSION --urls $env:INSTALLER_URL --submit --token $env:WINGET_PAT
          if ($LASTEXITCODE -ne 0) {
            Write-Host "update failed -- expected while the package is not yet in microsoft/winget-pkgs."
            Write-Host "Run the first submission manually: wingetcreate new $env:INSTALLER_URL --token <WINGET_PAT>"
            exit 0
          }
      - name: Write scoop manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            version    = $env:VERSION
            description = "Safe PATH & environment-variable manager for Windows"
            homepage   = "https://github.com/shehjaddev/pathctl"
            license    = "MIT"
            bin        = "pathctl.exe"
            url        = $env:INSTALLER_URL
            hash       = $env:INSTALLER_SHA256
            checkver   = "github"
            autoupdate = @{ url = "https://github.com/shehjaddev/pathctl/releases/download/v`$version/pathctl.exe" }
          }
          New-Item -ItemType Directory -Force -Path packaging | Out-Null
          ($manifest | ConvertTo-Json -Depth 4) | Set-Content -Encoding utf8 packaging/pathctl.json
          Write-Host "scoop manifest written to packaging/pathctl.json"
      - name: Submit scoop manifest
        shell: pwsh
        env:
          SCOOP_PAT: ${{ secrets.SCOOP_PAT }}
          # gh must authenticate as the PAT owner to open a PR to another repo
          # (the default GITHUB_TOKEN cannot).
          GH_TOKEN: ${{ secrets.SCOOP_PAT }}
        run: |
          if (-not $env:SCOOP_PAT) {
            Write-Host "No SCOOP_PAT secret -- scoop submission skipped (manifest ready; open a PR to ScoopInstaller/Extras with packaging/pathctl.json)"
            exit 0
          }
          git config user.name "shehjaddev"
          git config user.email "95466889+shehjaddev@users.noreply.github.com"
          git checkout -b "scoop/pathctl-$env:VERSION"
          # ScoopInstaller/Extras keeps manifests at the bucket root, not in a
          # subdirectory -- copy the generated manifest there before committing.
          Copy-Item packaging/pathctl.json ./pathctl.json
          git add pathctl.json
          git commit -m "pathctl: add $env:VERSION"
          git remote add fork "https://x-access-token:$env:SCOOP_PAT@github.com/shehjaddev/scoop-extras.git"
          git push fork "scoop/pathctl-$env:VERSION" --force
          gh pr create --repo ScoopInstaller/Extras --head shehjaddev:scoop/pathctl-$env:VERSION --title "pathctl: add $env:VERSION" --body "Auto-generated by the pathctl publish workflow." --fill
