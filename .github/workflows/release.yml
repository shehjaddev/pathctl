name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\release\pathctl.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path sha256.txt -Value $hash
          Write-Host "SHA256=$hash"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/pathctl.exe
            sha256.txt
          generate_release_notes: true
