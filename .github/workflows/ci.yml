name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - name: Verify embedded longPathAware manifest
        shell: pwsh
        run: |
          $sdk = "C:\Program Files (x86)\Windows Kits\10\bin"
          $mt = Get-ChildItem -Path $sdk -Recurse -Filter mt.exe |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw "mt.exe not found under $sdk" }
          & $mt.FullName -nologo "-inputresource:$pwd\target\release\pathctl.exe;#1" -out:manifest.xml
          if ($LASTEXITCODE -ne 0) { throw "mt.exe failed" }
          if (-not (Select-String -Path manifest.xml -Pattern "longPathAware")) {
            throw "longPathAware not found in embedded manifest"
          }
          Write-Host "manifest embedded OK"

  system-scope:
    runs-on: windows-latest
    env:
      PATHCTL_TEST_REAL_SYSTEM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub Windows runners run as admin, so this exercises real HKLM
      # environment writes (set -> read -> undo) on a uniquely named variable.
      - run: cargo test --test cli system_scope_gated -- --ignored
