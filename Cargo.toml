[package]
name = "pathctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Safe PATH & environment-variable manager for Windows: list, dedupe, reorder, edit with undo/diff/JSON safety net"
license = "MIT"
repository = "https://github.com/shehjaddev/pathctl"
keywords = ["windows", "path", "environment", "registry", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
strip = true
lto = true
